<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Text Only</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<header class="header">
		<img src="icons/icon128.png" alt="" class="header__logo">
		<div class="header__text">
			<h1 class="header__name">Text Only</h1>
			<span class="header__version"></span>
		</div>
	</header>

	<div class="card card--master">
		<label class="row__label" for="extension-enabled">
			<span class="row__title" id="extension-status">Enabled</span>
		</label>
		<label class="switch">
			<input type="checkbox" id="extension-enabled">
			<span class="switch__track"></span>
		</label>
	</div>

	<div class="card" id="settings">
		<div class="field">
			<label class="row__title" for="mode-all">Default</label>
			<div class="segmented" role="radiogroup" aria-label="Default mode">
				<input type="radio" name="mode" id="mode-all" value="on">
				<label for="mode-all">On all sites</label>
				<input type="radio" name="mode" id="mode-none" value="off">
				<label for="mode-none">Off all sites</label>
			</div>
			<span class="row__hint" id="mode-hint"></span>
		</div>

		<div class="row">
			<label class="row__label" for="site-toggle">
				<span class="row__title" id="site-host">This site</span>
				<span class="row__hint" id="site-hint">Text mode is off here</span>
			</label>
			<label class="switch">
				<input type="checkbox" id="site-toggle">
				<span class="switch__track"></span>
			</label>
		</div>

		<div class="row">
			<label class="row__label" for="block-video">
				<span class="row__title">Block video</span>
				<span class="row__hint">Media requests too</span>
			</label>
			<label class="switch">
				<input type="checkbox" id="block-video">
				<span class="switch__track"></span>
			</label>
		</div>
	</div>

	<div class="card card--list">
		<div class="field field--add">
			<label class="row__title" for="site-input" id="list-title">Sites</label>
			<div class="add-row">
				<input type="text" id="site-input" placeholder="example.com" spellcheck="false" autocomplete="off">
				<button type="button" id="site-add">Add</button>
			</div>
		</div>
		<ul class="site-list" id="site-list"></ul>
		<p class="site-empty" id="site-empty"></p>
	</div>

	<div class="card">
		<div class="row">
			<span class="row__title">Appearance</span>
			<div class="segmented" role="radiogroup" aria-label="Appearance">
				<input type="radio" name="theme" id="theme-system" value="system">
				<label for="theme-system">Auto</label>
				<input type="radio" name="theme" id="theme-light" value="light">
				<label for="theme-light">Light</label>
				<input type="radio" name="theme" id="theme-dark" value="dark">
				<label for="theme-dark">Dark</label>
			</div>
		</div>
	</div>

	<p class="status" id="status" data-state="idle">
		<span class="status__dot"></span>
		<span class="status__text">Checking…</span>
	</p>

	<footer class="footer">
		<a class="footer__link" href="https://github.com/sameernyaupane/text-only" target="_blank" rel="noopener">
			<svg class="footer__icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
			<span>Source</span>
		</a>
		<a class="footer__link" href="https://github.com/sameernyaupane/simple-auto-hd" target="_blank" rel="noopener">
			<svg class="footer__icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.72 3.5C3.3 3.5 2.2 4.62 2.2 6v4.5c0 .83.67 1.5 1.5 1.5h1v1.8c0 .39.47.59.74.31l2.1-2.11h2.14c1.42 0 2.52-1.12 2.52-2.5V6c0-1.38-1.1-2.5-2.52-2.5H4.72Zm7.98 2.8v2.7c0 1.75-1.4 3.1-3.12 3.1h-.4v.15c0 .41.34.75.75.75h1.3l1.35 1.36a.44.44 0 0 0 .75-.31v-1.05h.57c.69 0 1.25-.56 1.25-1.25V7.55c0-.69-.56-1.25-1.25-1.25h-.2Z"/></svg>
			<span>Popup style</span>
		</a>
	</footer>

	<script src="popup.js"></script>
</body>
</html>
